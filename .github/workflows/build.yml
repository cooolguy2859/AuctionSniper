name: Build AuctionSniper
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Validate Worker module syntax
        run: node --input-type=module --check < backend/worker.js
      - name: Validate D1 schema
        run: python backend/smoke_test.py
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AuctionSniper-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
